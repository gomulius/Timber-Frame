<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Sketch (source) on the left: dashed outline with construction lines -->
  <g fill="none" stroke="#1565C0" stroke-width="2" stroke-dasharray="4 2">
    <rect x="4" y="10" width="18" height="44"/>
    <line x1="4"  y1="22" x2="22" y2="22"/>
    <line x1="4"  y1="34" x2="22" y2="34"/>
    <line x1="4"  y1="46" x2="22" y2="46"/>
  </g>

  <!-- Clearly visible right-arrow in the gap -->
  <polygon points="26,32 36,22 36,28 46,28 46,36 36,36 36,42"
           fill="#4CAF50" stroke="#2E7D32" stroke-width="1"/>

  <!-- Rebuilt timber frame (result) on the right -->
  <g stroke="#8B4513" stroke-width="1">
    <rect x="48" y="10" width="12" height="4" fill="#DEB887"/>
    <rect x="48" y="50" width="12" height="4" fill="#DEB887"/>
    <rect x="49" y="14" width="3" height="36" fill="#DEB887"/>
    <rect x="54" y="14" width="3" height="36" fill="#DEB887"/>
    <rect x="59" y="14" width="1" height="36" fill="#DEB887"/>
  </g>
</svg>
