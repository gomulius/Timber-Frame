<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Sketch (dashed) going into frame (solid) via arrow -->
  <!-- Sketch representation: construction box with dashed lines -->
  <rect x="4" y="12" width="20" height="40" fill="none" stroke="#1565C0" stroke-width="2"
        stroke-dasharray="4 2"/>
  <line x1="4"  y1="22" x2="24" y2="22" stroke="#1565C0" stroke-width="1.5" stroke-dasharray="4 2"/>
  <line x1="4"  y1="32" x2="24" y2="32" stroke="#1565C0" stroke-width="1.5" stroke-dasharray="4 2"/>
  <line x1="4"  y1="42" x2="24" y2="42" stroke="#1565C0" stroke-width="1.5" stroke-dasharray="4 2"/>

  <!-- Arrow -->
  <polygon points="28,32 34,26 34,29 42,29 42,35 34,35 34,38" fill="#4CAF50"/>

  <!-- Solid frame on the right -->
  <g transform="translate(32, 0)">
    <rect x="14" y="12" width="18" height="4"  fill="#DEB887" stroke="#8B4513" stroke-width="1"/>
    <rect x="14" y="48" width="18" height="4"  fill="#DEB887" stroke="#8B4513" stroke-width="1"/>
    <rect x="15" y="16" width="3"  height="32" fill="#DEB887" stroke="#8B4513" stroke-width="1"/>
    <rect x="22" y="16" width="3"  height="32" fill="#DEB887" stroke="#8B4513" stroke-width="1"/>
    <rect x="28" y="16" width="3"  height="32" fill="#DEB887" stroke="#8B4513" stroke-width="1"/>
  </g>
</svg>
