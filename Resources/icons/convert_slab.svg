<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Original slab at the TOP (source) -->
  <rect x="6" y="6" width="52" height="8" fill="#808080" stroke="#404040" stroke-width="2"/>

  <!-- Down-arrow (slab -> frame) -->
  <polygon points="29,18 35,18 35,24 38,24 32,30 26,24 29,24"
           fill="#4CAF50"/>

  <!-- Timber floor frame at the BOTTOM (result): rims + joists in plan -->
  <g>
    <!-- Rim joists (long edges, horizontal in the icon) -->
    <rect x="6" y="34" width="52" height="4" fill="#DEB887" stroke="#8B4513" stroke-width="1"/>
    <rect x="6" y="54" width="52" height="4" fill="#DEB887" stroke="#8B4513" stroke-width="1"/>
    <!-- Joists spanning between the two rims -->
    <rect x="10" y="38" width="3" height="16" fill="#DEB887" stroke="#8B4513" stroke-width="1"/>
    <rect x="19" y="38" width="3" height="16" fill="#DEB887" stroke="#8B4513" stroke-width="1"/>
    <rect x="28" y="38" width="3" height="16" fill="#DEB887" stroke="#8B4513" stroke-width="1"/>
    <rect x="37" y="38" width="3" height="16" fill="#DEB887" stroke="#8B4513" stroke-width="1"/>
    <rect x="46" y="38" width="3" height="16" fill="#DEB887" stroke="#8B4513" stroke-width="1"/>
    <rect x="51" y="38" width="3" height="16" fill="#DEB887" stroke="#8B4513" stroke-width="1"/>
  </g>
</svg>
