<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background -->
  <rect x="2" y="2" width="60" height="60" rx="4" fill="#8B4513" stroke="#5D2E0C" stroke-width="2"/>
  
  <!-- Frame representation -->
  <!-- Bottom plate -->
  <rect x="6" y="50" width="52" height="6" fill="#DEB887" stroke="#8B4513" stroke-width="1"/>
  
  <!-- Top plate -->
  <rect x="6" y="8" width="52" height="6" fill="#DEB887" stroke="#8B4513" stroke-width="1"/>
  
  <!-- Left stud -->
  <rect x="8" y="14" width="5" height="36" fill="#DEB887" stroke="#8B4513" stroke-width="1"/>
  
  <!-- Middle studs -->
  <rect x="22" y="14" width="5" height="36" fill="#DEB887" stroke="#8B4513" stroke-width="1"/>
  <rect x="37" y="14" width="5" height="36" fill="#DEB887" stroke="#8B4513" stroke-width="1"/>
  
  <!-- Right stud -->
  <rect x="51" y="14" width="5" height="36" fill="#DEB887" stroke="#8B4513" stroke-width="1"/>
  
  <!-- Window opening indication (dashed) -->
  <rect x="27" y="24" width="10" height="16" fill="none" stroke="#4A90D9" stroke-width="1.5" stroke-dasharray="3,2"/>
</svg>
