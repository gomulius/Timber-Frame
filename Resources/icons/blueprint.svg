<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Classic blueprint sheet -->
  <rect x="6"  y="8" width="52" height="48" fill="#1E6EC7" stroke="#0E4A8C" stroke-width="2"
        rx="2"/>
  <!-- A simple framed-wall drawing in white lines -->
  <g fill="none" stroke="#FFFFFF" stroke-width="1.5">
    <!-- outer frame outline -->
    <rect x="14" y="16" width="36" height="30"/>
    <!-- plates (double top / single bottom) -->
    <line x1="14" y1="20" x2="50" y2="20"/>
    <line x1="14" y1="22" x2="50" y2="22"/>
    <line x1="14" y1="44" x2="50" y2="44"/>
    <!-- studs -->
    <line x1="20" y1="22" x2="20" y2="44"/>
    <line x1="26" y1="22" x2="26" y2="44"/>
    <line x1="32" y1="22" x2="32" y2="44"/>
    <line x1="38" y1="22" x2="38" y2="44"/>
    <line x1="44" y1="22" x2="44" y2="44"/>
    <!-- dimension line at the bottom -->
    <line x1="14" y1="52" x2="50" y2="52"/>
    <line x1="14" y1="50" x2="14" y2="54"/>
    <line x1="50" y1="50" x2="50" y2="54"/>
  </g>
</svg>
