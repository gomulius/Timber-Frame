<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Source: solid wall on the left -->
  <rect x="4" y="8" width="18" height="48" fill="#808080"
        stroke="#404040" stroke-width="2"/>

  <!-- Arrow pointing from wall (left) to frame (right): tip is on the
       RIGHT at x=46. Shaft starts at x=26. -->
  <polygon points="26,28 36,28 36,22 46,32 36,42 36,36 26,36"
           fill="#4CAF50" stroke="#2E7D32" stroke-width="1"/>

  <!-- Result: timber frame on the right -->
  <g stroke="#8B4513" stroke-width="1">
    <!-- top plate -->
    <rect x="48" y="10" width="12" height="4" fill="#DEB887"/>
    <!-- bottom plate -->
    <rect x="48" y="50" width="12" height="4" fill="#DEB887"/>
    <!-- studs -->
    <rect x="49" y="14" width="3" height="36" fill="#DEB887"/>
    <rect x="54" y="14" width="3" height="36" fill="#DEB887"/>
    <rect x="59" y="14" width="1" height="36" fill="#DEB887"/>
  </g>
</svg>
