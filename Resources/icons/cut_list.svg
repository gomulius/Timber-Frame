<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Spreadsheet / list background -->
  <rect x="8"  y="6" width="48" height="52" fill="#FFFFFF" stroke="#404040" stroke-width="2"
        rx="2"/>
  <!-- Header strip -->
  <rect x="8"  y="6" width="48" height="8"  fill="#4CAF50"/>
  <!-- Row separators -->
  <g stroke="#C0C0C0" stroke-width="1">
    <line x1="8" y1="22" x2="56" y2="22"/>
    <line x1="8" y1="30" x2="56" y2="30"/>
    <line x1="8" y1="38" x2="56" y2="38"/>
    <line x1="8" y1="46" x2="56" y2="46"/>
    <line x1="8" y1="54" x2="56" y2="54"/>
    <!-- Column separator -->
    <line x1="32" y1="14" x2="32" y2="58"/>
  </g>
  <!-- A tiny log/beam icon in the upper-right of the header to hint "timber" -->
  <rect x="42" y="7" width="12" height="6" fill="#DEB887" stroke="#8B4513" stroke-width="0.8"/>
  <line x1="46" y1="7" x2="46" y2="13" stroke="#8B4513" stroke-width="0.8"/>
  <line x1="50" y1="7" x2="50" y2="13" stroke="#8B4513" stroke-width="0.8"/>
</svg>
