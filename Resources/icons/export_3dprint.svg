<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Simple front-view FDM-style 3D printer -->

  <!-- Printer frame uprights -->
  <rect x="6"  y="6"  width="3" height="48" fill="#263238"/>
  <rect x="55" y="6"  width="3" height="48" fill="#263238"/>

  <!-- Top crossbar (where the Y-rails usually are) -->
  <rect x="6"  y="6"  width="52" height="4" fill="#263238"/>

  <!-- Horizontal gantry / X-rail with the print head -->
  <rect x="9" y="22" width="46" height="3" fill="#455A64"/>
  <!-- Print head block -->
  <rect x="27" y="18" width="10" height="10" fill="#1E88E5"
        stroke="#0D47A1" stroke-width="1"/>
  <!-- Nozzle -->
  <polygon points="30,28 34,28 32,32" fill="#455A64"/>

  <!-- Build plate -->
  <rect x="12" y="46" width="40" height="4" fill="#607D8B"
        stroke="#263238" stroke-width="1"/>

  <!-- A small printed object sitting on the bed, hinting at what the
       command produces (just a stack of layers - no roof/frame specific
       shape so the icon stays generic). -->
  <g fill="#4CAF50" stroke="#1B5E20" stroke-width="0.5">
    <rect x="22" y="42" width="20" height="2"/>
    <rect x="23" y="40" width="18" height="2"/>
    <rect x="24" y="38" width="16" height="2"/>
    <rect x="25" y="36" width="14" height="2"/>
  </g>
</svg>
