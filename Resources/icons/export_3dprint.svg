<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- A tiny scaled-down timber frame on the left -->
  <g stroke="#8B4513" stroke-width="1">
    <rect x="4"  y="12" width="22" height="3" fill="#DEB887"/>
    <rect x="4"  y="44" width="22" height="3" fill="#DEB887"/>
    <rect x="5"  y="15" width="2"  height="29" fill="#DEB887"/>
    <rect x="12" y="15" width="2"  height="29" fill="#DEB887"/>
    <rect x="19" y="15" width="2"  height="29" fill="#DEB887"/>
    <rect x="24" y="15" width="2"  height="29" fill="#DEB887"/>
  </g>

  <!-- Green right-arrow (frame -> print bed) -->
  <polygon points="30,30 34,24 34,27 42,27 42,33 34,33 34,36"
           fill="#4CAF50"/>

  <!-- 3D printer build plate + a stacked print, on the right -->
  <g>
    <!-- Build plate -->
    <rect x="42" y="48" width="20" height="4" fill="#607D8B"
          stroke="#263238" stroke-width="1"/>
    <!-- Printed layers (stacked lines, slightly offset for perspective) -->
    <g fill="#1E88E5" stroke="#0D47A1" stroke-width="0.5">
      <rect x="46" y="22" width="12" height="3"/>
      <rect x="45" y="26" width="14" height="3"/>
      <rect x="44" y="30" width="16" height="3"/>
      <rect x="44" y="34" width="16" height="3"/>
      <rect x="44" y="38" width="16" height="3"/>
      <rect x="44" y="42" width="16" height="3"/>
      <rect x="44" y="46" width="16" height="2"/>
    </g>
  </g>
</svg>
